name: ci

# **Merging to `main` is publication.** A bundle becomes available by being here,
# so there is no later moment at which anything could be refused — which is why
# every check the curator was designed to run "at publication" runs here, before
# the merge, and why a red run blocks it. An unenforced check is decoration.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # **Pinned, not floating.** These tools are cloned from repositories that can
  # change under this one, and a check whose behaviour moves on its own is a
  # check nobody can reason about — a green run today and a red run tomorrow on
  # the same content, with nothing in this repository's history to explain it.
  # Bumping a pin is a deliberate act, visible in a diff, reviewed like any
  # other change.
  #
  # The cost is that a fix upstream does not arrive until somebody edits these
  # lines. **Nothing currently notices when one moves on.** A `pins` job used to,
  # by going red weekly — it also ran on every push, so the default branch was
  # red on twenty consecutive merges and the signal stopped meaning anything. It
  # was removed rather than repaired: keeping pins current is dependency
  # management, and Renovate or Dependabot should do it by opening a pull request
  # nobody has to notice. See `.luma/backlog/ideas/dependency-updates-need-a-real-tool.md`.
  #
  # Until then this is a manual chore. The curator pin was verified current on 2026-08-26;
  # the foreman pin moved on 2026-09-02 with the spec v0.0.19 migration,
  # which is exactly the deliberate-bump case this comment describes. Bumping them is part of the namespace change rather than
  # routine maintenance, and in opposite directions: the curator pinned before
  # it requires a declared `namespace:`, which this catalog no longer has, and
  # the foreman pinned before it cannot derive one — so against this tree the
  # old pair would fail the manifest and mis-address every bundle.
  CURATOR_SHA: 407f9bc75ac6f448e6c6aa5105d3b2722ec461eb  # luma-catalog-curator
  FOREMAN_SHA: db70cbf391827aafa50b2212a5e5c380c13871f7  # luma-foreman — knows eager and generates INDEX.md

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history: the version check compares this tree against the base
      # branch, and a shallow clone has nothing to compare with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          # The floor both tools state. Neither has dependencies, so this is
          # the whole runtime.
          python-version: '3.11'

      - name: Clone the tools at their pinned commits
        run: |
          set -eu
          git clone -q https://github.com/LumaStack/luma-catalog-curator.git "$RUNNER_TEMP/curator"
          git -C "$RUNNER_TEMP/curator" checkout -q "$CURATOR_SHA"
          git clone -q https://github.com/LumaStack/luma-foreman.git "$RUNNER_TEMP/foreman"
          git -C "$RUNNER_TEMP/foreman" checkout -q "$FOREMAN_SHA"

      # Contradictions no individual project could ever detect: a bundle both
      # mandated and deprecated, a starter pinning what this catalog's own
      # mandate forbids, a requirement naming a bundle nobody publishes.
      - name: The catalog agrees with itself
        run: |
          set -eu
          "$RUNNER_TEMP/curator/bin/luma-catalog-curator" check .

      # **Only on a pull request, because only a pull request has a base.** On a
      # merge to main the comparison has already been made against the same
      # content, and re-running it against the previous commit would ask a
      # different and less useful question.
      - name: Every changed bundle said so in its version
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -eu
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          "$RUNNER_TEMP/curator/bin/luma-catalog-curator" check --against "origin/$BASE" .

      # A dangling wikilink, an unquoted wikilink in frontmatter, a template
      # carrying live frontmatter. Every one is conformant, so the bundle
      # publishes cleanly and the defect travels to every adopter.
      - name: No bundle is broken in a way only foreman notices
        run: |
          set -eu
          "$RUNNER_TEMP/foreman/bin/luma-foreman" inspect
