# Generated by `luma-foreman apply`. Edits are lost.
#
# Every Document that says when it applies, and what happens when it is
# not complied with. The permission gate reads the rows that block; it
# cannot be told to ignore them, and nothing in `agent-permissions`
# writes here.

[[rule]]
bundle = "lumastack/luma-catalog/backlog"
document = "policy/adopting-a-rule-the-corpus-does-not-meet"
title = "Adopting a rule the corpus does not meet"
path = ".luma/bundles/lumastack/luma-catalog/backlog/policy/adopting-a-rule-the-corpus-does-not-meet.md"
on_violation = "allow"
matches = ["topic:adopting a rule, tightening a policy, or changing what a record must contain"]

[[rule]]
bundle = "lumastack/luma-catalog/backlog"
document = "policy/showing-records"
title = "Showing records"
path = ".luma/bundles/lumastack/luma-catalog/backlog/policy/showing-records.md"
on_violation = "allow"
matches = ["eager"]

[[rule]]
bundle = "lumastack/luma-catalog/backlog"
document = "policy/when-a-work-item-splits"
title = "When a work item splits"
path = ".luma/bundles/lumastack/luma-catalog/backlog/policy/when-a-work-item-splits.md"
on_violation = "allow"
matches = ["eager"]
